name: absensi
description: "Aplikasi Jurnal Absensi Mahasiswa berbasis Flutter, Firebase Auth, Firestore, Provider, dan Dio REST API."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.2
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  provider: ^6.1.5
  dio: ^5.11.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
